<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>kanban archive test</title>
<!-- Gli stessi fogli, nello stesso ordine, di index.php. index.php ci appende
     ?v=filemtime: senza, il browser serve la copia in cache e si finisce per
     verificare il CSS di ieri. Qui il cache-buster e' a runtime. -->
<script>
['/assets/dist/app.min.css', '/assets/css/style.css', '/assets/css/theme-orlandi.css']
    .forEach(href => {
        const l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = href + '?v=' + Date.now();
        document.head.appendChild(l);
    });
</script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<main class="app-content">
  <div class="leads-view">
    <!-- markup identico a renderKanban() -->
    <div id="leads-kanban" class="kanban"></div>
  </div>
</main>

<script type="module">
// Il vero template di produzione, non una copia.
import { kanbanCardHtml } from '/assets/js/leads/templates.js';
import { KANBAN_ORDER, STATUS_LABELS } from '/assets/js/leads/constants.js';

const leads = [
    { id: 1, name: 'Marco', surname: 'Rossi', interest_type: 'affitto', budget_min: 400, budget_max: 700, agent_name: 'admin', status: 'new' },
    { id: 2, name: 'Kristi', surname: 'Komini', interest_type: 'acquisto', budget_min: 6777, budget_max: 564534, agent_name: 'admin', status: 'negotiating' },
    // senza agente: il bottone deve restare a destra lo stesso
    { id: 3, name: 'Anna', surname: 'Bianchi', interest_type: 'entrambi', budget_min: null, budget_max: null, agent_name: null, status: 'contacted' },
];

const groups = {};
KANBAN_ORDER.forEach(s => { groups[s] = []; });
leads.forEach(l => { (groups[l.status] || (groups[l.status] = [])).push(l); });

document.getElementById('leads-kanban').innerHTML = KANBAN_ORDER.map(status => {
    const items = groups[status] || [];
    const cards = items.length ? items.map(l => kanbanCardHtml(l, status)).join('') : '<div class="kanban__empty">Nessun lead</div>';
    return `
    <div class="kanban__col kanban__col--${status}">
        <div class="kanban__head">${STATUS_LABELS[status] || status}<span class="kanban__count">${items.length}</span></div>
        <div class="kanban__body">${cards}</div>
    </div>`;
}).join('');

if (window.lucide) window.lucide.createIcons();
</script>
</body></html>
