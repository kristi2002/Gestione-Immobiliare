<div class="appointments-view">
    <div class="view-header">
        <div class="view-header__text">
            <h2>Appuntamenti</h2>
            <p>Pianifica e gestisci visite, acquisizioni, atti e chiamate.</p>
        </div>
        <div class="view-header__actions">
            <!-- Fuori dalla .toolbar di proposito: filters.js raccoglie i campi
                 della barra dentro il popover "Filtri", e questo non è un filtro
                 fra i tanti — è la domanda "sto guardando avanti o indietro?",
                 che deve restare leggibile senza aprire niente. -->
            <div class="segmented" id="appt-scope" role="radiogroup" aria-label="Periodo">
                <label class="segmented__option">
                    <input type="radio" name="appt-scope" value="upcoming" checked>
                    <span><i data-lucide="calendar-clock"></i> Prossimi</span>
                </label>
                <label class="segmented__option">
                    <input type="radio" name="appt-scope" value="past">
                    <span><i data-lucide="history"></i> Storico</span>
                </label>
                <label class="segmented__option">
                    <input type="radio" name="appt-scope" value="">
                    <span>Tutti</span>
                </label>
            </div>
            <button class="btn btn--ghost" id="btn-appt-route" title="Ordina gli appuntamenti di una giornata e stima gli spostamenti"><i data-lucide="route"></i> Itinerario giornata</button>
            <button class="btn btn--primary" id="btn-new-appointment">+ Nuovo Appuntamento</button>
        </div>
    </div>

    <div id="appointments-alert" class="alert" style="display:none;"></div>

    <div class="db-stats">
        <div class="db-stat">
            <div class="db-stat__chip"><i data-lucide="calendar"></i></div>
            <div class="db-stat__label">Appuntamenti Oggi</div>
            <div class="db-stat__value" id="astat-today">—</div>
        </div>
        <div class="db-stat">
            <div class="db-stat__chip"><i data-lucide="calendar-days"></i></div>
            <div class="db-stat__label">Questa Settimana</div>
            <div class="db-stat__value" id="astat-week">—</div>
        </div>
        <div class="db-stat">
            <div class="db-stat__chip"><i data-lucide="clock"></i></div>
            <div class="db-stat__label">Programmati</div>
            <div class="db-stat__value" id="astat-scheduled">—</div>
        </div>
        <div class="db-stat">
            <div class="db-stat__chip"><i data-lucide="check-circle-2"></i></div>
            <div class="db-stat__label">Completati (mese)</div>
            <div class="db-stat__value" id="astat-done">—</div>
        </div>
    </div>
    <script>
    (function () {
        fetch('api/appointments.php?action=stats').then(function (r) { return r.json(); }).then(function (j) {
            if (!j.success) return;
            var set = function (id, v) { var el = document.getElementById(id); if (el) el.textContent = v; };
            set('astat-today', j.data.today); set('astat-week', j.data.week);
            set('astat-scheduled', j.data.scheduled); set('astat-done', j.data.done_month);
        }).catch(function () {});
    })();
    </script>

    <div class="toolbar">
        <div class="search-box">
            <input type="search" id="appt-search" class="form-input" placeholder="Cerca cliente, immobile, agente o note…" autocomplete="off">
        </div>
        <select id="appt-type-filter" class="form-select">
            <option value="">Tutti i tipi</option>
            <option value="visita">Visita</option>
            <option value="acquisizione">Acquisizione</option>
            <option value="atto">Atto</option>
            <option value="chiamata">Chiamata</option>
        </select>
        <select id="appt-status-filter" class="form-select">
            <option value="">Tutti gli stati</option>
            <option value="scheduled">Programmato</option>
            <option value="completed">Completato</option>
            <option value="cancelled">Annullato</option>
            <option value="no_show">Mancata presentazione</option>
        </select>
        <select id="appt-agent-filter" class="form-select" aria-label="Agente">
            <option value="">Tutti gli agenti</option>
        </select>
        <input type="date" id="appt-from" class="form-input" title="Da">
        <input type="date" id="appt-to" class="form-input" title="A">
    </div>

    <div id="appointments-grid" class="entity-grid">
        <div class="entity-loading">Caricamento…</div>
    </div>
    <div id="appointments-pagination" class="pagination-container"></div>
</div>

<!-- The old quick-view modal was replaced by the full scheda page
     (views/appointment_profile.html); cards now navigate there. -->

<script src="assets/js/route_planner.js"></script>
<script src="assets/js/appointments.js?v=4"></script>
