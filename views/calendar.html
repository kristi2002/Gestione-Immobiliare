<div class="calendar-view">
    <div class="view-header">
        <div class="view-header__text">
            <h2>Calendario</h2>
            <p>Appuntamenti e promemoria del mese. Clicca un giorno per aprire l'agenda.</p>
        </div>
        <div class="view-header__actions">
            <button class="btn btn--primary" id="btn-new-appointment">
                <i data-lucide="plus"></i> Nuovo appuntamento
            </button>
        </div>
    </div>

    <div id="calendar-alert" class="alert" style="display:none;"></div>

    <div class="cal-layout">
        <div class="cal-main">
            <div class="cal-toolbar">
                <div class="cal-nav">
                    <button type="button" class="cal-nav__btn" id="cal-prev" title="Mese precedente" aria-label="Mese precedente"><i data-lucide="chevron-left"></i></button>
                    <button type="button" class="cal-nav__btn" id="cal-next" title="Mese successivo" aria-label="Mese successivo"><i data-lucide="chevron-right"></i></button>
                    <h3 class="cal-title" id="cal-title">—</h3>
                    <button type="button" class="cal-today" id="cal-today">Oggi</button>
                </div>
                <div class="cal-toolbar__right">
                    <div class="cal-count" id="cal-count"></div>
                    <div class="cal-seg" id="cal-seg">
                        <button type="button" class="is-active" data-type="all">Tutti</button>
                        <button type="button" data-type="appointment">Appuntamenti</button>
                        <button type="button" data-type="reminder">Promemoria</button>
                    </div>
                </div>
            </div>

            <div class="cal-board">
                <div class="cal-weekdays">
                    <span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span class="is-weekend">Sab</span><span class="is-weekend">Dom</span>
                </div>
                <div class="cal-grid" id="cal-grid"></div>
            </div>

            <div class="cal-legend">
                <span><i class="cal-legend__key cal-legend__key--appointment"></i> Appuntamento</span>
                <span><i class="cal-legend__key cal-legend__key--reminder"></i> Promemoria</span>
                <span><i class="cal-legend__key cal-legend__key--done"></i> Completato</span>
                <span><i class="cal-legend__key cal-legend__key--cancelled"></i> Annullato</span>
                <span><i class="cal-legend__key cal-legend__key--no_show"></i> Mancata presentazione</span>
            </div>
        </div>

        <aside class="cal-side" id="cal-side">
            <div class="cal-side__head">
                <h3 class="cal-side__title" id="cal-side-title">
                    <span id="cal-side-date">Seleziona un giorno</span>
                    <span class="cal-side__count" id="cal-side-count"></span>
                </h3>
                <button type="button" class="cal-side__add" id="cal-side-add" title="Nuovo appuntamento in questa data" aria-label="Nuovo appuntamento in questa data" hidden>
                    <i data-lucide="plus"></i>
                </button>
            </div>
            <div id="cal-side-events" class="cal-side__events">
                <div class="cal-side__empty">
                    <i data-lucide="mouse-pointer-click"></i>
                    <p>Clicca su un giorno del calendario per vedere gli impegni.</p>
                </div>
            </div>
        </aside>
    </div>
</div>

<script src="assets/js/calendar.js"></script>
