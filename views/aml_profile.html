<div class="aml-profile-view">

    <div class="view-header">
        <div class="view-header__text">
            <h2>Fascicolo antiriciclaggio</h2>
            <p>Adeguata verifica di un singolo soggetto (D.lgs 231/2007), con le copie dei documenti raccolti.</p>
        </div>
    </div>

    <div id="amp-alert" class="alert" style="display:none;"></div>

    <!-- Hero: soggetto + rischio + stato -->
    <div class="appt-hero card" id="amp-hero">
        <div class="appt-hero__info">
            <div class="appt-hero__badges" id="amp-badges"></div>
            <h2 id="amp-title">Caricamento…</h2>
            <div class="appt-hero__meta" id="amp-meta"></div>
        </div>
        <div class="appt-hero__actions">
            <button class="btn btn--ghost btn--sm" id="amp-edit"><i data-lucide="pencil"></i> Modifica</button>
            <button class="btn btn--ghost btn--sm btn--danger" id="amp-delete"><i data-lucide="trash-2"></i> Elimina</button>
        </div>
    </div>

    <!-- Avviso di conformità: sta sopra tutto perché è ciò che manca, non ciò che c'è -->
    <div id="amp-compliance"></div>

    <div class="appt-scheda-grid">

        <div class="card appt-card">
            <div class="appt-card__header"><i data-lucide="user"></i><h3>Soggetto</h3></div>
            <div class="scheda-rows" id="amp-subject"></div>
        </div>

        <div class="card appt-card">
            <div class="appt-card__header"><i data-lucide="briefcase"></i><h3>Operazione</h3></div>
            <div id="amp-operation"></div>
        </div>

        <div class="card appt-card">
            <div class="appt-card__header"><i data-lucide="shield-check"></i><h3>Valutazione del rischio</h3></div>
            <div class="scheda-rows" id="amp-risk"></div>
        </div>

        <div class="card appt-card">
            <div class="appt-card__header"><i data-lucide="calendar-clock"></i><h3>Esito e conservazione</h3></div>
            <div class="scheda-rows" id="amp-outcome"></div>
        </div>

        <!-- Documento d'identità: i campi dichiarati + le copie effettive -->
        <div class="card appt-card appt-card--wide">
            <div class="appt-card__header">
                <i data-lucide="id-card"></i><h3>Documento d'identità e copie acquisite</h3>
                <button class="btn btn--primary btn--sm" id="amp-doc-add" style="margin-left:auto;">
                    <i data-lucide="upload"></i> Allega copia
                </button>
            </div>
            <div class="scheda-rows" id="amp-iddoc"></div>
            <div id="amp-docs-list"></div>
        </div>

        <div class="card appt-card appt-card--wide">
            <div class="appt-card__header"><i data-lucide="file-pen"></i><h3>Note interne</h3></div>
            <div id="amp-notes"></div>
        </div>

    </div>

    <p class="appt-footnote" id="amp-footnote"></p>
</div>

<!-- Upload copia documento -->
<div class="modal-overlay" id="amp-doc-modal" hidden>
    <div class="modal modal--sm" role="dialog">
        <div class="modal-header">
            <h3>Allega copia alla pratica</h3>
            <button class="modal-close" id="amp-doc-close" aria-label="Chiudi">&times;</button>
        </div>
        <form id="amp-doc-form">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label" for="amp-doc-type">Tipo</label>
                    <select id="amp-doc-type" class="form-select">
                        <option value="id">Documento d'identità</option>
                        <option value="id_front">Documento — fronte</option>
                        <option value="id_back">Documento — retro</option>
                        <option value="other">Altro documento della pratica</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="amp-doc-title-input">Titolo</label>
                    <input type="text" id="amp-doc-title-input" class="form-input" maxlength="255"
                           placeholder="Es. Carta d'identità AX1234567">
                </div>
                <div class="form-group">
                    <label class="form-label" for="amp-doc-file">File</label>
                    <input type="file" id="amp-doc-file" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="amp-doc-notes">Note</label>
                    <textarea id="amp-doc-notes" class="form-input" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn--ghost" id="amp-doc-cancel">Annulla</button>
                <button type="submit" class="btn btn--primary" id="amp-doc-save">Carica</button>
            </div>
        </form>
    </div>
</div>

<script src="assets/js/aml_profile.js"></script>
