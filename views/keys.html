<div class="keys-view">
    <div class="view-header">
        <div class="view-header__text">
            <h2>Gestione chiavi</h2>
            <p>Traccia chi ha le chiavi di ogni immobile.</p>
        </div>
        <div class="view-header__actions">
            <button class="btn btn--primary" id="btn-new-key">+ Registra chiavi</button>
        </div>
    </div>

    <div id="keys-alert" class="alert" style="display:none;"></div>

    <div class="toolbar">
        <div class="search-box">
            <input type="search" id="key-search" class="form-input" placeholder="Cerca indirizzo, detentore o codice portachiavi…" autocomplete="off">
        </div>
        <!-- Mostrato solo dove il browser espone BarcodeDetector (vedi keys.js). -->
        <button type="button" class="btn btn--ghost" id="btn-scan-key" hidden title="Inquadra il codice del portachiavi">
            <i data-lucide="scan-line"></i> Scansiona
        </button>
        <select id="key-status-filter" class="form-select">
            <option value="">Tutti gli stati</option>
            <option value="out">In possesso</option>
            <option value="in_office">In ufficio</option>
            <option value="lost">Smarrite</option>
            <option value="overdue">Solo in ritardo</option>
        </select>
    </div>

    <div id="keys-grid" class="entity-grid">
        <div class="entity-loading">Caricamento…</div>
    </div>
    <div id="keys-pagination" class="pagination-container"></div>
</div>

<div class="modal-overlay" id="key-history-modal" hidden>
    <div class="modal modal--md" role="dialog">
        <div class="modal-header">
            <h3 id="key-history-title">Storico custodia</h3>
            <button class="modal-close" id="key-history-close" aria-label="Chiudi">&times;</button>
        </div>
        <div class="modal-body">
            <div id="key-history-body"><div class="entity-loading">Caricamento…</div></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="key-scan-modal" hidden>
    <div class="modal modal--sm" role="dialog">
        <div class="modal-header">
            <h3>Scansiona portachiavi</h3>
            <button class="modal-close" id="key-scan-close" aria-label="Chiudi">&times;</button>
        </div>
        <div class="modal-body">
            <video id="key-scan-video" class="key-scan__video" playsinline muted></video>
            <p class="form-hint" id="key-scan-hint">Inquadra il codice a barre o il QR sull'etichetta.</p>
        </div>
    </div>
</div>

<script src="assets/js/keys.js"></script>
