<div class="contracts-view">
    <div class="view-header">
        <div class="view-header__text">
            <h2>Contratti</h2>
            <p>Contratti di vendita e locazione: genera PDF, canoni e scadenze.</p>
        </div>
        <div class="view-header__actions">
            <button class="btn btn--primary" id="btn-new-contract"><i data-lucide="plus"></i> Nuovo Contratto</button>
        </div>
    </div>

    <div id="contracts-alert" class="alert" style="display:none;"></div>

    <div class="db-card list-card">
        <div class="db-card__head"><h3>Lista Contratti</h3></div>

        <div class="toolbar">
            <div class="search-box">
                <input type="search" id="contract-search" class="form-input" placeholder="Cerca per immobile, inquilino, titolo…" autocomplete="off">
            </div>
            <select id="contract-property-filter" class="form-select">
                <option value="">Tutti gli immobili</option>
            </select>
            <select id="contract-type-filter" class="form-select">
                <option value="">Tutti i tipi</option>
                <option value="locazione">Locazione</option>
                <option value="compravendita">Compravendita</option>
                <option value="preliminare">Preliminare</option>
                <option value="mandato">Mandato</option>
                <option value="altro">Altro</option>
            </select>
        </div>

        <div class="filter-pills filter-pills--inset" id="contract-status-pills" role="group" aria-label="Filtra per stato">
            <button type="button" class="filter-pill filter-pill--all is-active" data-status="">Tutti</button>
            <button type="button" class="filter-pill filter-pill--active" data-status="__active">Attivi</button>
            <button type="button" class="filter-pill filter-pill--draft" data-status="draft">Bozza</button>
            <button type="button" class="filter-pill filter-pill--sent" data-status="sent">Inviato</button>
            <button type="button" class="filter-pill filter-pill--signed" data-status="signed">Firmato</button>
            <button type="button" class="filter-pill filter-pill--expired" data-status="__expired">Scaduti</button>
            <button type="button" class="filter-pill filter-pill--cancelled" data-status="cancelled">Annullato</button>
        </div>

        <div id="contracts-grid" class="entity-grid entity-grid--inset">
            <div class="entity-loading">Caricamento…</div>
        </div>
        <div id="contracts-pagination" class="pagination-container"></div>
    </div>
</div>

<!-- E-sign modal -->
<div class="modal-overlay" id="esign-modal" hidden>
    <div class="modal modal--sm">
        <div class="modal-header">
            <h3>Firma digitale</h3>
            <button class="modal-close" id="esign-modal-close">&times;</button>
        </div>
        <form id="esign-form" class="modal-body">
            <input type="hidden" id="esign-contract-id">
            <p class="text-muted" style="margin-bottom:12px">Genera un link di firma da inviare al firmatario. Il link scade dopo 30 giorni.</p>
            <div class="form-group"><label>Nome firmatario *</label><input type="text" id="esign-name" class="form-input" required></div>
            <div class="form-group"><label>Email firmatario *</label><input type="email" id="esign-email" class="form-input" required></div>
            <div id="esign-link-result" hidden style="margin-top:12px">
                <label class="text-muted">Link di firma:</label>
                <div style="display:flex;gap:8px;margin-top:6px">
                    <input type="text" id="esign-link-url" class="form-input" readonly style="flex:1">
                    <button type="button" class="btn btn--ghost btn--sm" id="btn-copy-esign">Copia</button>
                </div>
                <p id="esign-link-hint" class="text-muted" style="font-size:12px;margin-top:6px">Invia questo link al firmatario via email o WhatsApp.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn--ghost" id="esign-modal-cancel">Chiudi</button>
                <button type="submit" class="btn btn--primary" id="esign-modal-submit">Genera link</button>
            </div>
        </form>
    </div>
</div>

<!-- Rinnovo.
     Spostare la scadenza senza generare le rate dei mesi aggiunti significa un
     canone che non viene mai richiesto: le due cose stanno insieme, e la
     finestra lo dice prima di farlo. -->
<div class="modal-overlay" id="renew-modal" hidden>
    <div class="modal modal--sm" role="dialog" aria-labelledby="renew-modal-title">
        <div class="modal-header">
            <h3 id="renew-modal-title">Rinnova contratto</h3>
            <button class="modal-close" id="renew-modal-close" aria-label="Chiudi">&times;</button>
        </div>
        <form id="renew-form" class="modal-body">
            <input type="hidden" id="renew-contract-id">
            <p class="text-muted" id="renew-current" style="margin-bottom:12px"></p>
            <div class="form-group">
                <label for="renew-months">Durata del rinnovo (mesi)</label>
                <input type="number" id="renew-months" class="form-input" min="1" max="240" step="1">
                <small class="form-hint" id="renew-hint"></small>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn--ghost" id="renew-modal-cancel">Annulla</button>
                <button type="submit" class="btn btn--primary" id="renew-modal-submit">Rinnova</button>
            </div>
        </form>
    </div>
</div>

<!-- Disdetta.
     Quattro fatti che in una contestazione servono tutti: chi, quando l'ha
     comunicata, perche', e da quando la locazione non e' piu' in vigore. -->
<div class="modal-overlay" id="terminate-modal" hidden>
    <div class="modal modal--sm" role="dialog" aria-labelledby="terminate-modal-title">
        <div class="modal-header">
            <h3 id="terminate-modal-title">Registra disdetta</h3>
            <button class="modal-close" id="terminate-modal-close" aria-label="Chiudi">&times;</button>
        </div>
        <form id="terminate-form" class="modal-body">
            <input type="hidden" id="terminate-contract-id">
            <div class="form-group">
                <label for="terminate-by">Chi ha disdetto <span class="required">*</span></label>
                <select id="terminate-by" class="form-select" required>
                    <option value="locatore">Il locatore (proprietario)</option>
                    <option value="conduttore">Il conduttore (inquilino)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="terminate-notice">Data della comunicazione <span class="required">*</span></label>
                <input type="date" id="terminate-notice" class="form-input" required>
            </div>
            <div class="form-group">
                <label for="terminate-effective">Fine della locazione <span class="required">*</span></label>
                <input type="date" id="terminate-effective" class="form-input" required>
                <small class="form-hint" id="terminate-effective-hint"></small>
            </div>
            <div class="form-group">
                <label for="terminate-reason">Motivo</label>
                <input type="text" id="terminate-reason" class="form-input" maxlength="255"
                       placeholder="Es. necessità del locatore, trasferimento per lavoro…">
            </div>
            <div class="alert alert--warning" id="terminate-warning" hidden></div>
            <div class="modal-footer">
                <button type="button" class="btn btn--ghost" id="terminate-modal-cancel">Annulla</button>
                <button type="submit" class="btn btn--primary" id="terminate-modal-submit">Registra disdetta</button>
            </div>
        </form>
    </div>
</div>

<!-- Scheda Contratto quick-view -->
<div class="modal-overlay" id="contract-scheda-modal" hidden>
    <div class="modal" role="dialog">
        <div class="modal-header">
            <div>
                <h3 id="scheda-ct-title"></h3>
                <div id="scheda-ct-badges" class="scheda-modal-badges"></div>
            </div>
            <button class="modal-close" id="contract-scheda-close" aria-label="Chiudi">&times;</button>
        </div>
        <div class="modal-body" id="scheda-ct-body"></div>
        <div class="modal-footer">
            <button type="button" class="btn btn--ghost btn--sm" id="scheda-ct-advance" hidden></button>
            <button type="button" class="btn btn--ghost btn--sm" id="scheda-ct-generate" hidden><i data-lucide="calendar"></i> Genera scadenzario</button>
            <button type="button" class="btn btn--ghost btn--sm" id="scheda-ct-esign"><i data-lucide="pen-tool"></i> Firma</button>
            <button type="button" class="btn btn--ghost btn--sm" id="scheda-ct-edit"><i data-lucide="pencil"></i> Modifica</button>
            <button type="button" class="btn btn--ghost" id="scheda-ct-close2">Chiudi</button>
        </div>
    </div>
</div>

<script type="module" src="assets/js/contracts/index.js"></script>
