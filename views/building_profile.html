<div class="building-profile-view">

    <!-- Back nav -->
    <div class="profile-topbar">
        <button class="btn btn--ghost" id="btn-back-to-buildings">← Edifici</button>
    </div>

    <div class="view-header">
        <div class="view-header__text">
            <h2>Scheda edificio</h2>
            <p>Scheda completa dell'edificio: unità, amministratore e immobili collegati.</p>
        </div>
    </div>

    <!-- Hero card: avatar + name + admin + notes -->
    <div class="profile-hero card">
        <div class="profile-hero__avatar" id="profile-avatar"><i data-lucide="building"></i></div>
        <div class="profile-hero__info">
            <div class="profile-hero__name">
                <h2 id="profile-name">Caricamento...</h2>
            </div>
            <div class="profile-hero__meta" id="profile-meta"></div>
            <div class="profile-hero__notes" id="profile-notes" hidden>
                <strong>Note</strong>
                <p id="profile-notes-text"></p>
            </div>
        </div>
        <div class="profile-hero__actions">
            <button class="btn btn--ghost btn--sm" id="btn-profile-edit"><i data-lucide="pencil"></i> Modifica</button>
            <button class="btn btn--ghost btn--sm" id="btn-profile-link"><i data-lucide="link"></i> Collega immobile</button>
        </div>
    </div>

    <div id="profile-alert" class="alert" style="display:none;"></div>

    <!-- Amministratore -->
    <div class="card" id="profile-admin-card" style="margin-bottom:16px;" hidden>
        <h4 style="margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-muted);">Amministratore di condominio</h4>
        <div id="profile-admin-box" style="display:flex;gap:20px;flex-wrap:wrap;font-size:14px;"></div>
    </div>

    <!-- Immobili -->
    <div class="profile-panel__header">
        <span class="text-muted" id="profile-props-count"></span>
    </div>
    <div id="profile-props-grid" class="entity-grid">
        <div class="entity-loading">Caricamento…</div>
    </div>

</div>

<!-- reuse buildings.js modals by including the same markup ids the page already knows how to drive -->
<div class="modal-overlay" id="buildings-modal" hidden>
    <div class="modal modal--lg" role="dialog" aria-labelledby="buildings-modal-title">
        <div class="modal-header">
            <h3 id="buildings-modal-title">Modifica Edificio</h3>
            <button class="modal-close" id="buildings-modal-close" aria-label="Chiudi">&times;</button>
        </div>
        <form id="buildings-form" class="modal-body">
            <input type="hidden" id="buildings-id" name="id">

            <fieldset class="form-section">
                <legend>Dati edificio</legend>
                <div class="form-row form-row--2">
                    <div class="form-group">
                        <label for="buildings-name">Nome edificio <span class="required">*</span></label>
                        <input type="text" id="buildings-name" name="name" class="form-input" required maxlength="150">
                    </div>
                    <div class="form-group">
                        <label for="buildings-city">Città <span class="required">*</span></label>
                        <input type="text" id="buildings-city" name="city" class="form-input" required maxlength="100">
                    </div>
                </div>
                <div class="form-group">
                    <label for="buildings-address">Indirizzo <span class="required">*</span></label>
                    <input type="text" id="buildings-address" name="address" class="form-input" required maxlength="255">
                </div>
                <div class="form-group">
                    <label for="buildings-total-units">Unità totali</label>
                    <input type="number" id="buildings-total-units" name="total_units" class="form-input" min="0">
                </div>
            </fieldset>

            <fieldset class="form-section">
                <legend>Amministratore di condominio</legend>
                <div class="form-row form-row--2">
                    <div class="form-group">
                        <label for="buildings-admin-name">Nome amministratore</label>
                        <input type="text" id="buildings-admin-name" name="administrator_name" class="form-input" maxlength="150" autocomplete="off" placeholder="Studio / persona di riferimento">
                    </div>
                    <div class="form-group">
                        <label for="buildings-admin-phone">Telefono amministratore</label>
                        <input type="tel" id="buildings-admin-phone" name="administrator_phone" class="form-input" maxlength="30" inputmode="tel" autocomplete="off" placeholder="es. 0733 123456">
                    </div>
                </div>
                <div class="form-group">
                    <label for="buildings-admin-email">Email amministratore</label>
                    <input type="email" id="buildings-admin-email" name="administrator_email" class="form-input" maxlength="255" autocomplete="off" placeholder="amministratore@esempio.it">
                </div>
            </fieldset>

            <fieldset class="form-section">
                <legend>Note</legend>
                <div class="form-group">
                    <textarea id="buildings-notes" name="notes" class="form-textarea" rows="3"></textarea>
                </div>
            </fieldset>
            <div class="modal-footer">
                <button type="button" class="btn btn--ghost" id="buildings-modal-cancel">Annulla</button>
                <button type="submit" class="btn btn--primary" id="buildings-modal-save">Salva</button>
            </div>
        </form>
    </div>
</div>

<div class="modal-overlay" id="buildings-link-modal" hidden>
    <div class="modal modal--sm" role="dialog" aria-labelledby="buildings-link-title">
        <div class="modal-header">
            <h3 id="buildings-link-title">Collega Immobile</h3>
            <button class="modal-close" id="buildings-link-close" aria-label="Chiudi">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="buildings-link-building-id">
            <div class="form-group">
                <label for="buildings-link-property-id">Seleziona immobile da collegare</label>
                <select id="buildings-link-property-id" class="form-select">
                    <option value="">— Seleziona —</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn--ghost" id="buildings-link-cancel">Annulla</button>
            <button type="button" class="btn btn--primary" id="buildings-link-confirm">Collega</button>
        </div>
    </div>
</div>

<script src="assets/js/building_profile/index.js"></script>
