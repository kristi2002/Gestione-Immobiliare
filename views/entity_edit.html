    Reached as view.php?name=entity_edit with App.viewParams = { entity, id? }.

    registered in assets/js/entity_edit/schemas/, so there is nothing to write
    here per entity — adding a form is adding a schema file.
-->

            <h2>Caricamento…</h2>
            <p>Compilazione della scheda.</p>
        </div>
    </div>
    <div class="ef-boot" aria-live="polite">Preparazione del modulo…</div>
</div>

<script type="module" src="assets/js/entity_edit/index.js"></script>
